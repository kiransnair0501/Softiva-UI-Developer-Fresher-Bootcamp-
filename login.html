<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sign in to your NexaTech account."
    >

    <title>NexaTech | Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="site-header">

    <nav class="navbar container">

        <a
            href="index.html"
            class="logo"
        >
            Nexa<span>Tech</span>
        </a>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="pricing.html">
                    Pricing
                </a>
            </li>

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

        </ul>

    </nav>

</header>


<main>


    <section class="login-section">


        <div class="login-card">


            <div class="login-header">

                <div class="login-icon">
                    N
                </div>

                <p class="eyebrow">
                    WELCOME BACK
                </p>

                <h1>
                    Sign in to NexaTech
                </h1>

                <p>
                    Access your dashboard and manage your projects.
                </p>

            </div>


            <form
                class="login-form"
                action="#"
                method="post"
            >


                <!-- Email -->

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <div class="label-row">

                        <label for="login-password">
                            Password
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="8"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Remember -->

                <label class="remember-me">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <!-- Submit -->

                <button
                    type="submit"
                    class="button primary-button login-button"
                >
                    Sign In
                </button>


                <div class="login-divider">
                    <span>or</span>
                </div>


                <a
                    href="index.html"
                    class="button secondary-dark-button"
                >
                    Continue as visitor
                </a>


                <p class="signup-text">

                    Don't have an account?

                    <a href="index.html#contact">
                        Create an account
                    </a>

                </p>


            </form>

        </div>

    </section>


</main>


<footer class="site-footer">

    <div class="container footer-content">

        <div>

            <a
                href="index.html"
                class="logo footer-logo"
            >
                Nexa<span>Tech</span>
            </a>

            <p>
                Digital solutions for growing businesses.
            </p>

        </div>

    </div>

</footer>


</body>

</html>
