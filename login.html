<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sign in to your NexaTech account."
    >

    <title>NexaTech | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <nav
            class="navbar container"
            aria-label="Main navigation"
        >

            <a
                href="index.html"
                class="logo"
            >
                Nexa<span>Tech</span>
            </a>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="pricing.html">Pricing</a>
                </li>

                <li>
                    <a href="dashboard.html">Dashboard</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Main Content -->
    <main>

        <section
            class="login-section"
            aria-labelledby="login-title"
        >

            <div class="login-card">

                <!-- Login Header -->
                <div class="login-header">

                    <div
                        class="login-icon"
                        aria-hidden="true"
                    >
                        N
                    </div>

                    <p class="eyebrow">
                        WELCOME BACK
                    </p>

                    <h1 id="login-title">
                        Sign in to NexaTech
                    </h1>

                    <p>
                        Access your dashboard and manage your projects.
                    </p>

                </div>


                <!-- Login Form -->
                <form
                    class="login-form"
                    id="login-form"
                >

                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <div class="label-row">

                            <label for="password">
                                Password
                            </label>

                            <a href="#forgot-password">
                                Forgot password?
                            </a>

                        </div>


                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                minlength="8"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="password-toggle"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- Remember Me -->
                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="button primary-button login-button"
                    >
                        Sign In
                    </button>


                    <!-- JavaScript Message -->
                    <p
                        id="login-message"
                        class="form-message"
                        aria-live="polite"
                    ></p>


                    <!-- Divider -->
                    <div class="login-divider">
                        <span>or</span>
                    </div>


                    <!-- Visitor -->
                    <a
                        href="index.html"
                        class="button secondary-dark-button"
                    >
                        Continue as Visitor
                    </a>


                    <!-- Signup -->
                    <p class="signup-text">

                        Don't have an account?

                        <a href="index.html#contact">
                            Create an account
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="container footer-content">

            <div>

                <a
                    href="index.html"
                    class="logo footer-logo"
                >
                    Nexa<span>Tech</span>
                </a>

                <p>
                    Digital solutions for growing businesses.
                </p>

            </div>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
